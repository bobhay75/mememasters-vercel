name: MemeMasters studio CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate JavaScript syntax
        run: |
          node --check editor-core.mjs
          node --check app.mjs
      - name: Run editor unit tests
        run: node --test tests/editor.test.mjs
      - name: Verify static site and privacy boundaries
        run: python3 tests/site_contract.py
